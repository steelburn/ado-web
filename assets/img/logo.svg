<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ADO Code logo">
  <defs>
    <linearGradient id="ado-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b8fe0"/>
      <stop offset="1" stop-color="#005a9e"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#ado-bg)"/>
  <!-- opening code slash -->
  <path d="M27.5 20.5 18 32l9.5 11.5" stroke="#ffffff" stroke-width="5.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- closing code bracket: slash morphs into a check -->
  <path d="M36.5 20.5 46 32l-9.5 11.5" stroke="#ffffff" stroke-width="5.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.42"/>
  <path d="M36.5 20.5 42.6 27.8" stroke="#ffffff" stroke-width="5.5" fill="none" stroke-linecap="round" opacity="0"/>
  <!-- checkmark badge -->
  <circle cx="46.5" cy="46.5" r="10.5" fill="#1e1e1e"/>
  <circle cx="46.5" cy="46.5" r="9.25" fill="none" stroke="#4ec9b0" stroke-width="2"/>
  <path d="M42.2 46.4l3.1 3.1 5.4-5.8" stroke="#4ec9b0" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
