server {
    listen 80;
    server_name ado-code.ne1.dev;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # Security headers (re-included in locations that define their own
    # add_header — nginx does NOT inherit server-level add_header into them)
    include /etc/nginx/conf.d/security-headers.conf;

    # Long-lived caching for static assets
    location ~* \.(css|js|svg|png|jpg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        include /etc/nginx/conf.d/security-headers.conf;
    }

    location = / {
        expires -1;
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/security-headers.conf;
        try_files /index.html =404;
    }

    error_page 404 =404 /404.html;
}
